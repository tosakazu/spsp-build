# deploy/live-worker — 開催中の大会の速報を R2 に書く Worker (worker.js 冒頭を参照)。
# デプロイ: (cd deploy/live-worker && wrangler deploy)。鍵: wrangler secret put STARTGG_TOKEN
name = "spsp-live"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "spsp-data"

[triggers]
# 5 分ごと (2026-10-28 から。ログインした人のブラウザは start.gg から 15 秒ごとに直接読み直す: spsp-web js/live_fetch.js)
crons = ["*/5 * * * *"]

[observability]
enabled = true
