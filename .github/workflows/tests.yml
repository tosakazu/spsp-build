# 速いテスト (tests/run_all.sh)。鍵は使わない (Environment も付けない)・GITHUB_TOKEN は読むだけ。
# 外の人の PR は所有者が承認するまで走らない (リポジトリの設定)。
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 大会データ (日本、公開)。テストの一部が実データを読む
      - uses: actions/checkout@v4
        with:
          repository: tosakazu/smash_database
          ref: data-Japan
          path: smash_db_tournament
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.lock.txt
      - run: bash tests/run_all.sh py
